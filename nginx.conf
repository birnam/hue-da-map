server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static SPA; all real work happens client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Templates & modules should always reflect the deployed build.
    location ~* \.(js|css|json|xml)$ {
        add_header Cache-Control "no-cache";
    }

    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/xml                       xml;
        image/png                             png;
        image/svg+xml                         svg;
    }
    default_type application/octet-stream;
}
